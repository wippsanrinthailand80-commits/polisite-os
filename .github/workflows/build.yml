name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc flex bison libelf-dev libssl-dev \
            wget xz-utils cpio kmod ccache \
            qemu-system-x86
          # ccache speeds up rebuilds; not required but nice
          ccache --version || true

      - name: Build Linux kernel (x86_64, tinyconfig for CI)
        run: |
          export POLISITE_ARCH=x86_64
          export POLISITE_KERNEL_TINY=1
          export POLISITE_KERNEL_JOBS=$(nproc)
          bash build/build.sh
          echo "--- kernel artefact ---"
          ls -lh build/output/kernel/boot/
          file build/output/kernel/boot/vmlinuz-*

      - name: QEMU smoke — does the kernel boot?
        run: |
          set -uo pipefail
          KERN=$(ls build/output/kernel/boot/vmlinuz-* | head -n1)
          echo "Booting $KERN with QEMU (x86_64) ..."
          timeout 30 qemu-system-x86_64 \
            -m 512 -smp 1 -accel tcg \
            -kernel "$KERN" \
            -append "console=ttyS0 earlyprintk=serial" \
            -serial file:serial.log -display none -nographic || rc=$?
          echo "QEMU exit code: ${rc:-0}"
          echo "--- serial log (first 80 lines) ---"
          cat serial.log | head -n 80
          # A Linux boot always prints "Linux version" on the serial console.
          grep -q "Linux version" serial.log || {
            echo "Kernel did not print 'Linux version' — boot may have failed" >&2
            exit 1
          }
          echo "Smoke test passed."

      - name: Upload kernel artefact
        uses: actions/upload-artifact@v4
        with:
          name: polisite-kernel-x86_64
          path: build/output/kernel/boot/vmlinuz-*
