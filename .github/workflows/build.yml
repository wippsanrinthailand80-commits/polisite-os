name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc gcc-multilib make lld llvm mtools xorriso qemu-system-x86
          # limine is fetched by build.sh

      # The limine crate 0.6.x gates `#![feature(ptr_metadata)]`, so the kernel
      # builds on nightly. rust-toolchain.toml selects it; this step installs it.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-none

      - name: Install Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('kernel/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: build/output/limine
          key: limine-12.6.0

      - name: "Build kernel + ISO (fast CI small ramdisk)"
        run: RAMDISK_MB=10 bash build/build.sh

      - name: QEMU smoke test
        run: |
          set -uo pipefail
          # The kernel writes 0x10 to port 0xf4 on entry (ISA debug exit).
          # If the kernel is entered, QEMU exits with 0x10 (16).
          # We run with a generous timeout; success is judged by exit code 16.
          rc=0
          timeout 60 qemu-system-x86_64 \
            -m 512 -smp 1 -accel tcg \
            -cdrom build/output/polisite.iso -boot d \
            -serial file:serial.log -display none \
            -device isa-debug-exit,iobase=0xf4 || rc=$?
          echo "QEMU exit code: $rc"
          echo "--- serial log ---"
          cat serial.log
          # Expected exit code: 16 (0x10) = kernel entered.
          if [ "$rc" -ne 16 ]; then
            echo "Expected QEMU exit code 16 (kernel entered), got $rc"
            exit 1
          fi
          # Also verify the banner is in the serial log as a secondary check.
          grep -q "boot OK" serial.log || {
            echo "Boot banner not found in serial log" >&2
            exit 1
          }

      - name: Generate live screenshot
        if: always()
        run: |
          pip install -q Pillow || true
          python3 tools/gen_screenshot.py || echo "screenshot gen failed"
          ls -lh screenshot.png || true

      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-screenshot
          path: screenshot.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polisite-iso
          path: build/output/polisite.iso
