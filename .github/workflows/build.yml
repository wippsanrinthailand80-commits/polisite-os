name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc make lld llvm mtools xorriso qemu-system-x86
          # limine is fetched by build.sh

      # The limine crate 0.6.x gates `#![feature(ptr_metadata)]`, so the kernel
      # builds on nightly. rust-toolchain.toml selects it; this step installs it.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-none

      - name: Install Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Build kernel + ISO
        run: bash build/build.sh

      - name: QEMU smoke test
        run: |
          set -euo pipefail
          timeout 30 qemu-system-x86_64 \
            -m 256 -smp 1 -accel tcg \
            -cdrom build/output/polisite.iso -boot d \
            -serial file:serial.log -display none \
            -device isa-debug-exit,iobase=0xf4
          echo "--- serial log ---"
          cat serial.log
          grep -q "Polisite OS — boot OK" serial.log || {
            echo "Boot banner not found; failing." >&2
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polisite-iso
          path: build/output/polisite.iso
