name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc flex bison libelf-dev libssl-dev \
            wget xz-utils cpio kmod ccache \
            nasm gcc-multilib make lld llvm mtools xorriso qemu-system-x86
          ccache --version || true

      - name: Build Linux kernel (x86_64, full defconfig+broad for realistic size)
        run: |
          export POLISITE_ARCH=x86_64
          export POLISITE_KERNEL_TINY=0
          export POLISITE_KERNEL_JOBS=$(nproc)
          bash build/build.sh
          echo "--- kernel artefact ---"
          ls -lh build/output/kernel/boot/
          file build/output/kernel/boot/vmlinuz-*

      - name: QEMU smoke — does the kernel+initramfs boot?
        run: |
          set -uo pipefail
          KERN=$(ls build/output/kernel/boot/vmlinuz-* | head -n1)
          INITRD=build/output/kernel/boot/initrd
          echo "Booting $KERN + $INITRD ..."
          timeout 30 qemu-system-x86_64 \
            -m 512 -smp 1 -accel tcg \
            -kernel "$KERN" -initrd "$INITRD" \
            -append "console=ttyS0 earlyprintk=serial root=/dev/ram0 rdinit=/init panic=1" \
            -serial file:serial.log -display none -nographic -device isa-debug-exit,iobase=0xf4
          echo "--- serial log ---"
          cat serial.log
          grep -q "Polisite OS — initramfs banner" serial.log
          grep -q "Polisite OS — boot OK" serial.log
          echo "Kernel+initramfs smoke passed."

      - name: Verify ISO size (~200 MB demo)
        run: |
          ls -lh build/output/polisite.iso
          du -sh build/output/polisite.iso
          SIZE=$(stat -c%s build/output/polisite.iso)
          MB=$(( SIZE / 1024 / 1024 ))
          echo "ISO size: ${MB} MB"
          if [ "$MB" -lt 150 ] || [ "$MB" -gt 300 ]; then
            echo "ISO size outside expected 150–300 MB window" >&2
            exit 1
          fi

      - name: QEMU smoke — does the ISO boot?
        run: |
          set -uo pipefail
          timeout 30 qemu-system-x86_64 -m 512 -smp 1 -accel tcg \
            -cdrom build/output/polisite.iso -boot d \
            -serial file:iso-serial.log -display none -nographic -device isa-debug-exit,iobase=0xf4
          echo "--- ISO serial log ---"
          cat iso-serial.log
          grep -q "Polisite OS — initramfs banner" iso-serial.log
          grep -q "Polisite OS — boot OK" iso-serial.log
          echo "ISO smoke passed."

      - name: Upload kernel + ISO
        uses: actions/upload-artifact@v4
        with:
          name: polisite-kernel+iso-x86_64
          path: |
            build/output/kernel/boot/vmlinuz-*
            build/output/polisite.iso
